<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ürün Eşleştirme Onayı</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            padding: 24px;
            text-align: center;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .progress-badge {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .comparison-layout {
            display: flex;
            gap: 24px;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 768px) {
            .comparison-layout {
                flex-direction: row;
                align-items: stretch;
            }
        }

        .card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .card-local::before {
            background: linear-gradient(to right, #3b82f6, #60a5fa);
        }

        .card-ewg::before {
            background: linear-gradient(to right, #10b981, #34d399);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .image-container {
            width: 100%;
            height: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            position: relative;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .card:hover .product-image {
            transform: scale(1.05);
        }

        .no-image {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-main);
        }

        .match-score-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            color: #f8fafc;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--bg-color);
            z-index: 5;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        @media (max-width: 767px) {
            .match-score-badge {
                position: relative;
                transform: none;
                top: auto;
                left: auto;
                margin: -20px auto;
                border: 2px solid var(--card-border);
            }
        }

        .match-score-badge span {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .match-score-badge .score-value {
            font-size: 1.2rem;
            color: #34d399;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            max-width: 240px;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-correct {
            background-color: var(--success);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .btn-correct:hover {
            box-shadow: 0 12px 32px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        .btn-incorrect {
            background-color: var(--danger);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-incorrect:hover {
            box-shadow: 0 12px 32px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 1.2rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .finished-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 60vh;
        }

        .finished-icon {
            font-size: 80px;
            color: var(--success);
            margin-bottom: 24px;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p style="color: var(--text-muted);">Yükleniyor...</p>
    </div>

    <header class="header">
        <h1>AI Ürün Eşleştirme Onayı</h1>
        <div class="progress">
            <span>Kalan Onay:</span>
            <span class="progress-badge" id="remainingCount">--</span>
        </div>
    </header>

    <div class="container" id="mainContainer">
        
        <div class="comparison-layout">
            
            <!-- Local Product Card -->
            <div class="card card-local fade-in">
                <span class="card-label"><i class="fas fa-store"></i> Local Product</span>
                <div class="image-container">
                    <img id="localImage" class="product-image" src="" alt="Local Product Image" style="display: none;">
                    <div id="localNoImage" class="no-image">
                        <i class="fas fa-image fa-3x"></i>
                        <span>Resim Yok</span>
                    </div>
                </div>
                <h2 id="localTitle" class="product-title">Loading...</h2>
            </div>
            
            <div class="match-score-badge fade-in" style="animation-delay: 0.1s;">
                <span>Benzerlik</span>
                <div class="score-value" id="matchScore">--</div>
            </div>

            <!-- EWG Product Card -->
            <div class="card card-ewg fade-in" style="animation-delay: 0.2s;">
                <span class="card-label"><i class="fas fa-globe"></i> EWG Product</span>
                <div class="image-container">
                    <img id="ewgImage" class="product-image" src="" alt="EWG Product Image" style="display: none;">
                    <div id="ewgNoImage" class="no-image">
                        <i class="fas fa-image fa-3x"></i>
                        <span>Resim Yok</span>
                    </div>
                </div>
                <h2 id="ewgTitle" class="product-title">Loading...</h2>
            </div>

        </div>

        <div class="actions fade-in" style="animation-delay: 0.3s;">
            <button class="btn btn-incorrect" onclick="submitDecision('incorrect')">
                <i class="fas fa-times"></i> Yanlış
            </button>
            <button class="btn btn-correct" onclick="submitDecision('correct')">
                <i class="fas fa-check"></i> Doğru
            </button>
        </div>

    </div>

    <div class="container finished-container" id="finishedContainer">
        <i class="fas fa-check-circle finished-icon"></i>
        <h1>Tüm Eşleşmeler Onaylandı!</h1>
        <p style="color: var(--text-muted); margin-top: 16px; max-width: 400px; line-height: 1.6;">
            Dosyadaki tüm ürünlerin doğruluk durumları değerlendirildi. 
            Sonuçlar json dosyalarına kaydedildi.
        </p>
    </div>

    <script>
        let currentMatch = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadNextMatch();
        });

        function setImage(imgElementId, noImgElementId, src) {
            const imgEl = document.getElementById(imgElementId);
            const noImgEl = document.getElementById(noImgElementId);
            
            if (src) {
                imgEl.src = src;
                imgEl.style.display = 'block';
                noImgEl.style.display = 'none';
                
                // Fallback for broken images
                imgEl.onerror = function() {
                    imgEl.style.display = 'none';
                    noImgEl.style.display = 'flex';
                };
            } else {
                imgEl.style.display = 'none';
                noImgEl.style.display = 'flex';
            }
        }

        async function loadNextMatch() {
            try {
                const response = await fetch('/api/next_match');
                const data = await response.json();
                
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);

                if (data.status === 'done') {
                    showFinishedState();
                    return;
                }

                if (data.status === 'success') {
                    currentMatch = data.match;
                    
                    // Update UI
                    document.getElementById('remainingCount').textContent = data.remaining;
                    
                    // Local Card
                    document.getElementById('localTitle').textContent = currentMatch.local_product || 'Bilinmeyen Ürün';
                    setImage('localImage', 'localNoImage', currentMatch.local_image);
                    
                    // EWG Card
                    document.getElementById('ewgTitle').textContent = currentMatch.ewg_product || 'Bilinmeyen Ürün';
                    setImage('ewgImage', 'ewgNoImage', currentMatch.ewg_image);
                    
                    // Score
                    const scorePercentage = (currentMatch.score * 100).toFixed(1) + '%';
                    document.getElementById('matchScore').textContent = scorePercentage;
                    
                    // Reset animation
                    const cards = document.querySelectorAll('.fade-in');
                    cards.forEach(card => {
                        card.style.animation = 'none';
                        card.offsetHeight; /* trigger reflow */
                        card.style.animation = null; 
                    });
                }
            } catch (error) {
                console.error('Error fetching match:', error);
                alert('Bir hata oluştu, lütfen sayfayı yenileyin.');
            }
        }

        async function submitDecision(decision) {
            if (!currentMatch) return;
            
            // Show brief loading state directly on buttons
            document.querySelectorAll('.btn').forEach(btn => btn.style.pointerEvents = 'none');
            
            try {
                const response = await fetch('/api/submit_decision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ match: currentMatch, decision: decision })
                });
                
                if (response.ok) {
                    loadNextMatch();
                } else {
                    alert('Kaydedilirken hata oluştu!');
                }
            } catch (error) {
                console.error('Error submitting decision:', error);
                alert('Kaydedilirken hata oluştu!');
            } finally {
                document.querySelectorAll('.btn').forEach(btn => btn.style.pointerEvents = 'auto');
            }
        }

        function showFinishedState() {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('finishedContainer').style.display = 'flex';
            document.getElementById('remainingCount').textContent = '0';
        }
    </script>
</body>
</html>
