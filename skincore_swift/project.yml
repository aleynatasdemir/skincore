name: SkinCore
options:
  bundleIdPrefix: com.skincore
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  SkinCore:
    type: application
    platform: iOS
    sources: [SkinCore]
    settings:
      base:
        INFOPLIST_FILE: SkinCore/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.skincore.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: SkinCore/SkinCore.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
